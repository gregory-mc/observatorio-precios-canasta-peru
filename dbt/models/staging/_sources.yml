version: 2

sources:
  - name: bronze
    schema: bronze
    description: >
      Capa Bronze — CSV crudos descargados de Cloudflare R2 e insertados en
      Postgres por `observatorio.carga.r2_a_supabase`. Idempotente por partición
      de fecha. Estas tablas son la única fuente de los modelos staging (silver).
    tables:
      - name: marketplace_precios
        description: "Catálogo de precios de alimentos scrapeado del marketplace (un snapshot por día)."
        columns:
          - name: fecha_captura
            description: "Fecha del snapshot (hora Lima)."
          - name: product_id
            description: "Identificador del producto en la fuente."
          - name: precio
            description: "Precio de venta observado."

      - name: sisap_precios
        description: "Precios minoristas/mayoristas de MIDAGRI-SISAP para Lima (días hábiles)."
        columns:
          - name: fecha_captura
            description: "Fecha de captura (hora Lima)."
          - name: tipo_mercado
            description: "minorista | mayorista."
          - name: producto
            description: "Nombre del producto según SISAP."
          - name: precio_prom
            description: "Precio promedio del día."

      - name: osinergmin_precios
        description: "Precios de combustible por establecimiento (OSINERGMIN/Facilito), un CSV por día."
        columns:
          - name: fecha_captura
            description: "Fecha de captura (hora Lima)."
          - name: codigo_osi
            description: "Código del establecimiento."
          - name: producto
            description: "Tipo de combustible."
          - name: precio_soles_galon
            description: "Precio en soles por galón."

      - name: clima
        description: "Clima diario por localidad de región productora (Open-Meteo): precipitación y temp máx/mín, un CSV por día."
        columns:
          - name: fecha_captura
            description: "Fecha de la observación (hora Lima)."
          - name: localidad
            description: "Localidad/punto de la región productora. Grano junto con fecha_captura."
          - name: precip_mm
            description: "Precipitación acumulada del día (mm)."
          - name: temp_max_c
            description: "Temperatura máxima (°C)."
          - name: temp_min_c
            description: "Temperatura mínima (°C)."

      - name: inei_ipc
        description: "Serie histórica del IPC del INEI (carga one-shot, no diaria)."
        columns:
          - name: periodo
            description: "Periodo del índice (anio+mes)."
          - name: indice
            description: "Valor del índice IPC."
          - name: var_mensual
            description: "Variación porcentual mensual."

  - name: ml
    schema: ml
    description: >
      Capa ML — salida CRUDA del modelado, escrita por `observatorio.ml` (Python).
      Producto = nombre crudo de la fuente (grano de fct_precio_diario). dbt la lee
      como source y construye los marts gold (fct_predicciones, fct_anomalias),
      reduciendo el producto a los 6 slugs MVP. Python nunca escribe gold.
    tables:
      - name: predicciones_raw
        description: "Pronósticos por serie y corrida (yhat + bandas). La escribe run_entrenamiento."
        columns:
          - name: fecha_corrida
            description: "Día en que se corrió el batch (hora Lima)."
          - name: producto
            description: "Nombre crudo del producto según la fuente."
          - name: fecha_pred
            description: "Día pronosticado."
          - name: yhat
            description: "Pronóstico central."
      - name: anomalias_raw
        description: "Días con residuo normalizado > Nσ por serie y corrida. La escribe run_anomalias."
        columns:
          - name: fecha_corrida
            description: "Día en que se corrió la detección (hora Lima)."
          - name: producto
            description: "Nombre crudo del producto según la fuente."
          - name: fecha
            description: "Día de la observación anómala."
          - name: z_score
            description: "Residuo normalizado."
      - name: backtest_metricas
        description: "Métricas de backtesting (MAPE/RMSE) por serie y modelo. Diagnóstica; sin mart gold."
