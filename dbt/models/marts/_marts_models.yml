version: 2

models:
  - name: fct_precio_diario
    description: >
      Hecho de precio diario conformado desde las fuentes de precios de alimentos
      (silver). Grain: (fecha_captura, fuente, cod_departamento, producto). SISAP
      es Lima (cod '15'); Marketplace es nacional (cod_departamento null).
      OSINERGMIN (combustible) queda fuera. La reducción a los 6 productos MVP y
      el costo de canasta se harán en un mart posterior.
    columns:
      - name: fecha_captura
        description: "Día de la observación (hora Lima). FK a dim_fecha.fecha."
        tests:
          - not_null
          - relationships:
              to: ref('dim_fecha')
              field: fecha
      - name: fuente
        description: "Origen del precio."
        tests:
          - not_null
          - accepted_values:
              values: ["sisap_minorista", "sisap_mayorista", "marketplace"]
      - name: cod_departamento
        description: "Departamento ('15' Lima para SISAP; null = nacional para Marketplace)."
      - name: producto
        description: "Nombre del producto tal como viene de la fuente. Parte del grano."
        tests: [not_null]
      - name: precio_prom
        description: "Precio promedio de las observaciones del grano (> 0)."
        tests: [not_null]
      - name: precio_min
        description: "Precio mínimo observado en el grano."
      - name: precio_max
        description: "Precio máximo observado en el grano."
      - name: n_obs
        description: "Número de observaciones agregadas en el grano."
        tests: [not_null]

  - name: fct_precio_medias_moviles
    description: >
      Medias móviles de precio a 7 / 30 / 90 días de CALENDARIO por
      (fuente, cod_departamento, producto), issue #25. Deriva de fct_precio_diario
      (mismo grano, una fila por día observado). La ventana es de calendario, no de
      N observaciones, porque las fuentes publican de forma esparsa; n_obs_* indica
      cuántas observaciones cayeron en cada ventana (confiabilidad).
    columns:
      - name: fecha_captura
        description: "Día de la observación (hora Lima). FK a dim_fecha.fecha."
        tests:
          - not_null
          - relationships:
              to: ref('dim_fecha')
              field: fecha
      - name: fuente
        description: "Origen del precio."
        tests:
          - not_null
          - accepted_values:
              values: ["sisap_minorista", "sisap_mayorista", "marketplace"]
      - name: cod_departamento
        description: "Departamento ('15' Lima para SISAP; null = nacional para Marketplace)."
      - name: producto
        description: "Nombre del producto tal como viene de la fuente. Parte del grano."
        tests: [not_null]
      - name: precio_prom
        description: "Precio promedio del día (el mismo de fct_precio_diario)."
        tests: [not_null]
      - name: precio_ma_7d
        description: "Media móvil del precio en la ventana de 7 días de calendario."
        tests: [not_null]
      - name: precio_ma_30d
        description: "Media móvil del precio en la ventana de 30 días de calendario."
        tests: [not_null]
      - name: precio_ma_90d
        description: "Media móvil del precio en la ventana de 90 días de calendario."
        tests: [not_null]
      - name: n_obs_7d
        description: "Observaciones dentro de la ventana de 7 días (≥ 1)."
        tests: [not_null]
      - name: n_obs_30d
        description: "Observaciones dentro de la ventana de 30 días."
        tests: [not_null]
      - name: n_obs_90d
        description: "Observaciones dentro de la ventana de 90 días."
        tests: [not_null]

  - name: dim_fecha
    description: >
      Dimensión de calendario (spine continuo) sobre el rango de fct_precio_diario.
    columns:
      - name: fecha
        description: "Día. Clave de la dimensión."
        tests: [not_null, unique]
      - name: dia_semana
        description: "Día de la semana ISO (1=lunes … 7=domingo)."
        tests: [not_null]
      - name: es_fin_semana
        description: "True para sábado/domingo."
        tests: [not_null]

  - name: fct_predicciones
    description: >
      Pronóstico de precio reducido a los 6 productos MVP (issue #27). Deriva de
      ml.predicciones_raw agregando las variedades crudas de SISAP a su slug MVP
      (promedio de yhat y de las bandas). Grain: (fecha_corrida, fuente,
      cod_departamento, producto, fecha_pred). Conserva todas las corridas.
    columns:
      - name: fecha_corrida
        description: "Día en que se corrió el batch de pronóstico (hora Lima)."
        tests: [not_null]
      - name: fuente
        description: "Origen del precio modelado (solo SISAP en el MVP de ML)."
        tests:
          - not_null
          - accepted_values:
              values: ["sisap_minorista", "sisap_mayorista"]
      - name: cod_departamento
        description: "Departamento ('15' Lima para SISAP)."
      - name: producto
        description: "Slug del producto de la canasta."
        tests:
          - not_null
          # Los 13 productos de la canasta (#155). Fuente de verdad:
          # `observatorio/canasta/productos.py::CANASTA_GRUPOS` y su espejo SQL
          # `dbt/macros/slug_producto_mvp.sql`. Si se agrega un producto hay que
          # tocar los tres — este test es el que avisa si falta uno.
          - accepted_values:
              values: ["aceite", "arroz", "azucar", "carne_res", "cebolla", "huevo", "leche", "limon", "menestras", "papa", "pescado", "pollo", "tomate"]
      - name: fecha_pred
        description: "Día pronosticado (futuro respecto a fecha_corrida)."
        tests: [not_null]
      - name: precio_pred
        description: "Precio pronosticado (promedio de las variedades del slug)."
        tests: [not_null, no_negativo]
      - name: precio_pred_inf
        description: "Banda inferior (promedio; null si el modelo no la produce)."
        tests: [no_negativo]
      - name: precio_pred_sup
        description: "Banda superior (promedio; null si el modelo no la produce)."
        tests: [no_negativo]
      - name: modelo
        description: "Modelo usado ('prophet' | 'media_movil' | 'naive' | 'mixto')."
        tests:
          - not_null
          - accepted_values:
              values: ["prophet", "media_movil", "naive", "mixto"]
      - name: n_variedades
        description: "Cuántas variedades crudas se agregaron en este slug."
        tests: [not_null]

  - name: fct_anomalias
    description: >
      Anomalías de precio reducidas a los 6 productos MVP (issue #28). Deriva de
      ml.anomalias_raw agregando las variedades de un slug anómalas el mismo día;
      reporta la desviación más fuerte (z_abs_max). Grain: (fecha_corrida, fuente,
      cod_departamento, producto, fecha).
    columns:
      - name: fecha_corrida
        description: "Día en que se corrió la detección (hora Lima)."
        tests: [not_null]
      - name: fuente
        description: "Origen del precio (solo SISAP en el MVP de ML)."
        tests:
          - not_null
          - accepted_values:
              values: ["sisap_minorista", "sisap_mayorista"]
      - name: cod_departamento
        description: "Departamento ('15' Lima para SISAP)."
      - name: producto
        description: "Slug del producto de la canasta."
        tests:
          - not_null
          # Los 13 productos de la canasta (#155). Fuente de verdad:
          # `observatorio/canasta/productos.py::CANASTA_GRUPOS` y su espejo SQL
          # `dbt/macros/slug_producto_mvp.sql`. Si se agrega un producto hay que
          # tocar los tres — este test es el que avisa si falta uno.
          - accepted_values:
              values: ["aceite", "arroz", "azucar", "carne_res", "cebolla", "huevo", "leche", "limon", "menestras", "papa", "pescado", "pollo", "tomate"]
      - name: fecha
        description: "Día de la observación anómala."
        tests: [not_null]
      - name: z_abs_max
        description: "Máximo |residuo normalizado| entre las variedades del slug."
        tests: [not_null]
      - name: umbral_sigma
        description: "σ usado como corte."
        tests: [not_null]
