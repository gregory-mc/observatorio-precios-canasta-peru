[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observatorio-precios"
version = "0.1.0"
description = "Observatorio diario de precios de alimentos y su impacto en la canasta básica en Perú"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

# Dependencias compartidas por todos los componentes
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Scrapers / pipeline de ingesta
ingesta = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tabula-py>=2.9",
    "holidays>=0.46",
    "openpyxl>=3.1",
    # OSINERGMIN/Facilito gatea las consultas con reCAPTCHA v3: hace falta un
    # navegador real (no requests) para minar el token. Tras instalar el paquete
    # hay que bajar el binario:  python -m playwright install chromium
    "playwright>=1.45",
]
# Carga Bronze: R2 (archivos crudos) → Supabase Postgres
# psycopg ya está en las dependencias base; aquí el cliente de R2 y `holidays`
# (calendario laboral peruano: distingue ausencia normal de SISAP en finde/feriado).
carga = [
    "boto3>=1.34",
    "holidays>=0.46",
]
# Transformaciones SQL
dbt = [
    "dbt-postgres>=1.8",
]
# Notebooks de exploración (ENAHO microdatos, etc. — issue #13).
# enahodata descarga los microdatos del INEI (funciona desde IP peruana; el
# geo-bloqueo solo afecta a los runners de GitHub). pyreadstat lee los .dta/.sav
# preservando las etiquetas de valor, imprescindibles para descifrar los códigos
# de producto. El respaldo opcional a R2 reutiliza el cliente boto3 del grupo
# `carga`, así que la instalación recomendada es:  pip install -e ".[notebooks,carga]"
notebooks = [
    "jupyterlab>=4.0",
    "enahodata>=0.0.3",
    "pyreadstat>=1.2",
    "matplotlib>=3.8",
]
# Modelado y análisis
ml = [
    "prophet>=1.1",
    "duckdb>=1.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]
# Dashboard público
dashboard = [
    "streamlit>=1.36",
    "plotly>=5.22",
    "folium>=0.17",
]
# API REST
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# Herramientas de desarrollo
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",  # cliente de tests para FastAPI (starlette TestClient)
]

# --------------------------------------------------------------------------- #
# Solo para el instalador de Streamlit Community Cloud (#49)
# --------------------------------------------------------------------------- #
# Cloud instala con Poetry en cuanto ve un pyproject.toml, e ignora el
# requirements.txt de la raíz. Dos cosas que Poetry no resuelve por su cuenta y
# que hacían fallar el deploy:
#
#   1. Busca un paquete con el nombre del proyecto (`observatorio_precios`) y el
#      nuestro se llama `observatorio` → "No file/folder found for package
#      observatorio-precios" y el build muere.
#   2. No entiende `[project.optional-dependencies]` sin `--extras`, y Cloud no
#      lo pasa: el extra `dashboard` se salteaba entero (streamlit y plotly
#      aparecían como "Not required"), así que ni con el punto 1 resuelto habría
#      arrancado la app.
#
# Los grupos de Poetry, a diferencia de los extras, se instalan por defecto.
# Nada de esto afecta a pip ni a hatchling, que ignoran `[tool.poetry]`.
[tool.poetry]
packages = [{ include = "observatorio" }]

# Espejo del extra `dashboard` para este instalador. Si cambian las versiones
# allá arriba, hay que cambiarlas acá también.
[tool.poetry.group.dashboard.dependencies]
streamlit = ">=1.36"
plotly = ">=5.22"

[tool.hatch.build.targets.wheel]
packages = ["observatorio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI usa `Query()/Depends()/etc.` en los defaults de los parámetros a
# propósito (es el idioma del framework); no es el antipatrón que B008 detecta.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Depends",
]

[tool.mypy]
# pandas no publica stubs en su propio paquete; sin pandas-stubs instalado,
# ignoramos el import para que mypy valide nuestro código sin ahogarse en la
# librería de terceros.
[[tool.mypy.overrides]]
module = ["pandas.*", "pyreadstat.*", "prophet.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conexion (handshake Supabase) y tests/ingesta/sisap (scripts de
# experimentación/backfill) no son tests: hacen exit()/red al importar y
# romperían la colección. Se excluyen de la corrida automatizada.
addopts = "--ignore=tests/conexion --ignore=tests/ingesta/sisap"
