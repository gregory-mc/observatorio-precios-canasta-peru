# Hooks de pre-commit del observatorio.
# Instalar una sola vez:  pip install -e ".[dev]" && pre-commit install
# Correr sobre todo el repo: pre-commit run --all-files
#
# ruff-format reemplaza a black (formateo) y ruff cubre el lint (E,F,I,UP,B,
# según [tool.ruff.lint] de pyproject.toml). Excludes alineados con pyproject.

exclude: '^(tests/conexion|tests/ingesta/sisap)/'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff           # lint
        args: [--fix]
      - id: ruff-format    # formato (reemplaza black)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
