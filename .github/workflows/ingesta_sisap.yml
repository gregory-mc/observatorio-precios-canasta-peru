# .github/workflows/ingesta-sisap.yml
name: Cron Diario - Ingesta Bronze SISAP

on:
  schedule:
    # ⏰ Corre de forma automática a las 15:30 UTC (10:30 AM hora de Perú) todos los días
    - cron: '30 15 * * *'
  workflow_dispatch:
    # 🚀 Permite activarlo manualmente desde GitHub web

jobs:
  ejecutar_ingesta:
    runs-on: self-hosted

    steps:
    - name: 📥 Clonar el Repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 🛠️ Instalar Dependencias (Pip Tradicional)
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 boto3

    - name: 🛰️ Ejecutar Script de Ingesta Diaria
      # 🟢 Si el MIDAGRI está caído, el workflow no se romperá de forma agresiva
      continue-on-error: true
      shell: powershell
      env:
        PYTHONUTF8: "1"
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        $env:PYTHONPATH = "${{ github.workspace }}"
        python observatorio/ingesta/sisap/run_ingesta_sisap.py

    - name: 📦 Almacenar Snapshot como Artefacto de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-sisap
        path: observatorio/ingesta/sisap/output_bronze_sisap/
        retention-days: 3