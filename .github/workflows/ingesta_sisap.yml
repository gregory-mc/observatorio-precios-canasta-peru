# .github/workflows/ingesta-sisap.yml
name: Cron Diario - Ingesta Bronze SISAP

on:
  schedule:
    # ⏰ Corre de forma automática a las 19:00 UTC (02:00 PM hora de Perú) todos los días
    - cron: '00 19 * * *'
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: 'Forzar fallo para probar la alerta (true/false)'
        required: false
        default: 'false'

jobs:
  ejecutar_ingesta:
    runs-on: self-hosted

    steps:
    - name: 📥 Clonar el Repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 🛠️ Instalar Dependencias (Pip Tradicional)
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 boto3

    - name: 🛰️ Ejecutar Script de Ingesta Diaria
      shell: powershell
      env:
        PYTHONUTF8: "1"
        SIMULAR_FALLO: ${{ github.event.inputs.simular_fallo || 'false' }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        $env:PYTHONPATH = "${{ github.workspace }}"
        python observatorio/ingesta/sisap/run_ingesta_sisap.py

    - name: 📦 Almacenar Snapshot como Artefacto de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-sisap
        path: observatorio/ingesta/sisap/output_bronze_sisap/
        retention-days: 3

    - name: 🚨 Crear issue de alerta por fallo
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        gh issue create \
          --title "🚨 [SISAP] Fallo de ingesta $(date -u -d '-5 hours' +%Y-%m-%d)" \
          --body "## Fallo detectado en ingesta SISAP

        El workflow **${{ github.workflow }}** falló el $(date -u -d '-5 hours' +%F).

        **Detalles:**
        - Runner: \`${{ runner.name }}\`
        - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        > Issue auto-creado por GitHub Actions — revisar logs del run para diagnóstico." \
          --label "area:devops"