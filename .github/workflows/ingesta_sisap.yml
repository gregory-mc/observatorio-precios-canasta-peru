# .github/workflows/ingesta-sisap.yml
name: Cron Diario - Ingesta Bronze SISAP

on:
  schedule:
    # ⏰ Corre de forma automática a las 13:00 PM UTC (08:00 AM hora de Perú) todos los días
    - cron: '00 13 * * *'
  workflow_dispatch:
    # 🚀 Permite activarlo manualmente desde GitHub web

jobs:
  ejecutar_ingesta:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar el Repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 🛠️ Instalar Dependencias (Pip Tradicional)
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 🛰️ Ejecutar Script de Ingesta Diaria
      # 🟢 Si el MIDAGRI está caído, el workflow no se romperá de forma agresiva
      continue-on-error: true
      run: |
        export PYTHONPATH="${{ github.workspace }}"
        python observatorio/ingesta/sisap/run_ingesta_sisap.py

    - name: 📦 Almacenar HTML Crudo como Artefacto de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-sisap-html
        path: observatorio/ingesta/sisap/output_bronze_sisap/
        retention-days: 3