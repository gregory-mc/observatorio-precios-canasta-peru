# .github/workflows/ingesta-sisap.yml
name: Cron Diario - Ingesta Bronze SISAP

on:
  schedule:
    # ⏰ Corre de forma automática a las 19:00 UTC (02:00 PM hora de Perú) lunes a viernes
    - cron: '00 19 * * 1-5'
  workflow_dispatch:
    inputs:
      fecha_objetivo:
        description: 'Fecha a ingestar en formato YYYY-MM-DD (vacío = hoy en hora Perú)'
        required: false
        default: ''
      simular_fallo:
        description: 'Forzar fallo para probar la alerta (true/false)'
        required: false
        default: 'false'

jobs:
  ejecutar_ingesta:
    runs-on: self-hosted
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write

    steps:
    - name: 📥 Clonar el Repositorio
      uses: actions/checkout@v7

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 🛠️ Instalar Dependencias (Pip Tradicional)
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 boto3 holidays

    - name: 🛰️ Ejecutar Script de Ingesta Diaria
      shell: powershell
      env:
        PYTHONUTF8: "1"
        SIMULAR_FALLO: ${{ github.event.inputs.simular_fallo || 'false' }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        $env:PYTHONPATH = "${{ github.workspace }}"
        $fecha = "${{ github.event.inputs.fecha_objetivo }}"
        if ($fecha) {
          python observatorio/ingesta/sisap/run_ingesta_sisap.py --fecha $fecha
        } else {
          python observatorio/ingesta/sisap/run_ingesta_sisap.py
        }

    - name: 📦 Almacenar Snapshot como Artefacto de GitHub
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-sisap
        path: observatorio/ingesta/sisap/output_bronze_sisap/
        retention-days: 3

    - name: 🚨 Alerta (abre / comenta / cierra sola)
      # Corre siempre para poder CERRAR la alerta cuando el pipeline vuelve
      # a verde, y para alertar también cuando el job es cancelado (timeout o
      # runner self-hosted caído), caso que `if: failure()` no cubría.
      if: always()
      uses: ./.github/actions/alerta
      with:
        fuente: SISAP
        resumen: Fallo de ingesta
        etiqueta: area:devops
        resultado: ${{ job.status }}
        causas: >-
          MIDAGRI publica con retraso (tabla vacía tras los reintentos), cambio del HTML de SISAP, o caída de la fuente.
        token: ${{ secrets.GITHUB_TOKEN }}
