name: Carga Bronze - R2 a Supabase

on:
  schedule:
    # ⏰ 16:00 America/Lima (UTC-5) = 21:00 UTC. Corre después de ambos scrapers
    # (marketplace 09:00 y SISAP 14:00 hora Lima), así los CSV del día ya están en R2.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      fuente:
        description: 'Fuente a cargar (marketplace / sisap / osinergmin / inei / ambas; ambas = las 3 diarias, sin inei)'
        required: false
        default: 'ambas'
      fecha:
        description: 'Fecha YYYY-MM-DD a cargar (vacío = hoy hora Lima)'
        required: false
        default: ''
      simular_fallo:
        description: 'Forzar fallo para probar la alerta (true/false)'
        required: false
        default: 'false'

jobs:
  cargar:
    # Solo habla con R2 (Cloudflare) y Supabase, ambos públicos: no aplica el
    # geo-bloqueo del MIDAGRI, así que corre en el runner estándar de GitHub.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias de carga
        run: pip install -e ".[carga]"

      # Carga los CSV del día desde R2 → Supabase Postgres (schema bronze).
      # Requiere estos secrets del repo (Settings > Secrets and variables > Actions):
      #   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET
      #   SUPABASE_DB_URL  -> connection string del pooler de Supabase (puerto 6543)
      - name: Cargar R2 → Supabase (bronze)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SIMULAR_FALLO: ${{ github.event.inputs.simular_fallo || 'false' }}
          FUENTE: ${{ github.event.inputs.fuente || 'ambas' }}
          FECHA: ${{ github.event.inputs.fecha || '' }}
        run: |
          set -euo pipefail
          ARGS=(--fuente "$FUENTE")
          if [ -n "$FECHA" ]; then ARGS+=(--fecha "$FECHA"); fi
          python -m observatorio.carga.r2_a_supabase "${ARGS[@]}"

      - name: 🚨 Alerta (abre / comenta / cierra sola)
        # Corre siempre para poder CERRAR la alerta cuando el pipeline vuelve
        # a verde, y para alertar también cuando el job es cancelado (timeout o
        # runner self-hosted caído), caso que `if: failure()` no cubría.
        if: always()
        uses: ./.github/actions/alerta
        with:
          fuente: Carga Bronze
          resumen: Fallo de carga R2→Supabase
          etiqueta: area:devops
          resultado: ${{ job.status }}
          causas: >-
            si el mensaje dice «sin archivos cargados», el fallo es aguas arriba: el scraper de esa fuente no dejó el CSV en R2. Revisar primero la alerta de la fuente.
          token: ${{ secrets.GITHUB_TOKEN }}
