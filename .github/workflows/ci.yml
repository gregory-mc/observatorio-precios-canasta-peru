name: CI

# CI básico de PRs: lint/format (ruff vía pre-commit) + tests (pytest).
# Distinto de los workflows de ingesta/carga, que son crons de producción.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint + formato (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Corre los mismos hooks que en local (.pre-commit-config.yaml):
      # ruff (lint) + ruff-format + chequeos básicos.
      - uses: pre-commit/action@v3.0.1

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        # [ingesta] aporta las libs que importan los módulos bajo test.
        run: pip install -e ".[dev,ingesta]"
      - name: Pytest
        run: pytest -q
