name: Pipeline ML (predicciones + anomalías)

# Entrena los pronósticos, detecta anomalías, mide el backtesting y materializa
# los dos marts gold que dependen de `ml.*`.
#
# Cadencia semanal a propósito: las series SISAP son esparsas (de 163 series solo
# ~15 superan el umbral de config.py) y reentrenar a diario no aporta señal nueva.
#
# ⚠️ NO declarar PYTHONUTF8=1 aquí ni en ningún runner Windows: rompe Prophet vía
# cmdstanpy (docs/ml.md §1). En ubuntu-latest no hace falta.

on:
  # Lunes 23:00 UTC = 18:00 Lima, una hora después del dbt diario, así entrena
  # contra el gold del día. Habilitado el 2026-07-24 tras la primera corrida
  # manual en verde (2,436 predicciones · 477 anomalías · 453 métricas, PASS=22).
  schedule:
    - cron: "0 23 * * 1"
  workflow_dispatch:
    inputs:
      fecha_corrida:
        description: 'Fecha de la corrida YYYY-MM-DD (vacío = hoy hora Lima)'
        required: false
        default: ''
      solo_marts:
        description: 'Saltar el batch y solo materializar los marts (true/false)'
        required: false
        default: 'false'

concurrency:
  group: ml-prod
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Prophet baja y compila cmdstan la primera vez; el default de 6h es de sobra,
    # pero acotamos para no dejar un runner colgado.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `ml` para el batch y `dbt` para materializar los marts al final.
      - name: Instalar ML + dbt
        run: pip install -e ".[ml,dbt]"

      # Los tres runners fallan sin escribir si se cae un modelo entero o si se
      # pierde más del 30% de las series (observatorio/ml/cobertura.py), así que
      # un fallo silencioso del batch marca el workflow en rojo.
      - name: Entrenamiento batch → ml.predicciones_raw
        if: ${{ github.event.inputs.solo_marts != 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FECHA_CORRIDA: ${{ github.event.inputs.fecha_corrida || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$FECHA_CORRIDA" ]; then ARGS+=(--fecha-corrida "$FECHA_CORRIDA"); fi
          python -m observatorio.ml.run_entrenamiento "${ARGS[@]}"

      - name: Detección de anomalías → ml.anomalias_raw
        if: ${{ github.event.inputs.solo_marts != 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FECHA_CORRIDA: ${{ github.event.inputs.fecha_corrida || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$FECHA_CORRIDA" ]; then ARGS+=(--fecha-corrida "$FECHA_CORRIDA"); fi
          python -m observatorio.ml.run_anomalias "${ARGS[@]}"

      - name: Backtesting walk-forward → ml.backtest_metricas
        if: ${{ github.event.inputs.solo_marts != 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FECHA_CORRIDA: ${{ github.event.inputs.fecha_corrida || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$FECHA_CORRIDA" ]; then ARGS+=(--fecha-corrida "$FECHA_CORRIDA"); fi
          python -m observatorio.ml.run_backtesting "${ARGS[@]}"

      - uses: ./.github/actions/entorno-dbt
        with:
          db-url: ${{ secrets.SUPABASE_DB_URL }}

      # Estos dos marts son responsabilidad de este workflow: el dbt diario los
      # excluye porque sus fuentes `ml.*` solo cambian aquí.
      - name: Materializar marts gold de ML
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        working-directory: dbt
        run: dbt build --select fct_predicciones fct_anomalias

      - name: 🚨 Alerta (abre / comenta / cierra sola)
        # Corre siempre para poder CERRAR la alerta cuando el pipeline vuelve
        # a verde, y para alertar también cuando el job es cancelado (timeout o
        # runner self-hosted caído), caso que `if: failure()` no cubría.
        if: always()
        uses: ./.github/actions/alerta
        with:
          fuente: ML
          resumen: Fallo del pipeline de predicciones
          etiqueta: area:ml
          resultado: ${{ job.status }}
          causas: >-
            si el mensaje menciona pérdida de series (`cobertura.py`), el batch abortó **sin escribir**: las tablas `ml.*` conservan la corrida anterior.
          token: ${{ secrets.GITHUB_TOKEN }}
