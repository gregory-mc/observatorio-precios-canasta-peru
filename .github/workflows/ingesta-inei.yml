name: Ingesta Histórica - IPC INEI

# Descarga one-shot del IPC histórico del INEI (issue #12). NO tiene cron: se
# dispara a mano cada vez que el INEI publica un mes nuevo. Hace las dos etapas
# en un solo run: descarga + subida a R2, y luego carga a bronze (Supabase).
on:
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: 'Forzar fallo en la carga para probar la alerta (true/false)'
        required: false
        default: 'false'

jobs:
  ingesta-inei:
    # El INEI (www.inei.gob.pe, .gob.pe) bloquea las IPs de datacenter igual que
    # el MIDAGRI: desde los runners de GitHub la descarga falla con "Network is
    # unreachable" (Errno 101). Corre en el self-hosted con IP peruana — el mismo
    # runner Windows que usa SISAP.
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # No se instala el paquete editable (igual que SISAP): solo las deps que
      # tocan estos dos módulos. requests+openpyxl (descarga/parseo), boto3 (R2),
      # psycopg (carga a Supabase).
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl boto3 "psycopg[binary]"

      # 1. Descarga el Excel del INEI, valida cobertura y sube el CSV a R2.
      #    Requiere los secrets R2_* (Settings > Secrets and variables > Actions).
      - name: Descargar IPC INEI → R2
        shell: powershell
        env:
          PYTHONUTF8: "1"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          python -m observatorio.ingesta.inei.run_ingesta_inei

      - name: Guardar CSV como artifact
        uses: actions/upload-artifact@v7
        with:
          name: inei-ipc-${{ github.run_id }}
          path: observatorio/ingesta/inei/output_bronze_inei/
          retention-days: 14

      # 2. Carga el CSV desde R2 → Supabase Postgres (bronze.inei_ipc, reemplazo
      #    total). Requiere además SUPABASE_DB_URL.
      - name: Cargar R2 → Supabase (bronze.inei_ipc)
        shell: powershell
        env:
          PYTHONUTF8: "1"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SIMULAR_FALLO: ${{ github.event.inputs.simular_fallo || 'false' }}
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          python -m observatorio.carga.r2_a_supabase --fuente inei

      - name: 🚨 Alerta (abre / comenta / cierra sola)
        # Corre siempre para poder CERRAR la alerta cuando el pipeline vuelve
        # a verde, y para alertar también cuando el job es cancelado (timeout o
        # runner self-hosted caído), caso que `if: failure()` no cubría.
        if: always()
        uses: ./.github/actions/alerta
        with:
          fuente: INEI IPC
          resumen: Fallo de ingesta histórica
          etiqueta: area:devops
          resultado: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
