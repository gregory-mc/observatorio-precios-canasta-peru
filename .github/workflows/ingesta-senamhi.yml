# .github/workflows/ingesta-senamhi.yml
name: Cron Diario - Ingesta Bronze SENAMHI

on:
  schedule:
    # ⏰ Diario a las 20:00 UTC (03:00 PM hora de Perú), antes de la carga a
    # Supabase (21:00 UTC). SENAMHI publica todos los días (incluso findes y
    # feriados), así que corre 7 días/semana, igual que OSINERGMIN.
    - cron: '00 20 * * *'
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: 'Forzar fallo para probar la alerta (true/false)'
        required: false
        default: 'false'
      fecha:
        description: 'Fecha YYYY-MM-DD a capturar (vacío = hoy Perú; admite backfill ~30 días)'
        required: false
        default: ''
      limite:
        description: 'Máx estaciones (debug, opcional)'
        required: false
        default: ''

jobs:
  ejecutar_ingesta:
    # Self-hosted (PC con IP peruana): SENAMHI geo-bloquea IPs de datacenter igual
    # que MIDAGRI/INEI. Mismo runner que SISAP/OSINERGMIN. No usa navegador: las
    # rutas de datos no tienen Cloudflare Turnstile, así que basta `requests`.
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write

    steps:
    - name: 📥 Clonar el Repositorio
      uses: actions/checkout@v7

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 🛠️ Instalar Dependencias
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        pip install requests boto3

    - name: 🌦️ Ejecutar Script de Ingesta Diaria
      shell: powershell
      env:
        PYTHONUTF8: "1"
        SIMULAR_FALLO: ${{ github.event.inputs.simular_fallo || 'false' }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        $env:PYTHONPATH = "${{ github.workspace }}"
        $args = @()
        $fecha = "${{ github.event.inputs.fecha }}"
        if (-not [string]::IsNullOrWhiteSpace($fecha)) { $args += @("--fecha", $fecha) }
        $limite = "${{ github.event.inputs.limite }}"
        if (-not [string]::IsNullOrWhiteSpace($limite)) { $args += @("--limite", $limite) }
        python -m observatorio.ingesta.senamhi.run_ingesta_senamhi @args

    - name: 📦 Almacenar Snapshot como Artefacto de GitHub
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-senamhi
        path: data/bronze/senamhi/
        retention-days: 3
        if-no-files-found: ignore

    - name: 🚨 Crear issue de alerta por fallo
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        $fechaLima = (Get-Date).ToUniversalTime().AddHours(-5).ToString("yyyy-MM-dd")
        $titulo = "ALERTA [SENAMHI] Fallo de ingesta $fechaLima"
        $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        $lineas = @(
          "## Fallo detectado en ingesta SENAMHI (clima)",
          "",
          "El workflow **${{ github.workflow }}** fallo el $fechaLima.",
          "",
          "**Detalles:**",
          "- Runner: ${{ runner.name }}",
          "- Run: $runUrl",
          "",
          "Posibles causas: cambio del HTML/flujo de SENAMHI, geo-bloqueo, o caida de la fuente.",
          "",
          "> Issue auto-creado por GitHub Actions - revisar logs del run para diagnostico."
        )
        $bodyFile = Join-Path $env:RUNNER_TEMP "alerta_senamhi.txt"
        $lineas | Out-File -FilePath $bodyFile -Encoding utf8
        gh issue create --title $titulo --body-file $bodyFile --label "area:ingesta"
