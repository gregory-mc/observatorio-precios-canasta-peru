name: Ingesta Marketplace

on:
  schedule:
    - cron: "0 9 * * *" # 04:00 America/Lima (UTC-5)
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: 'Forzar fallo para probar la alerta (true/false)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias de ingesta
        run: pip install -e ".[ingesta]"

      - name: Scrapear precios de Marketplace
        env:
          SIMULAR_FALLO: ${{ github.event.inputs.simular_fallo || 'false' }}
        run: python -m observatorio.ingesta.marketplace.scrape --salida data/bronze

      - name: Guardar snapshot como artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-${{ github.run_id }}
          path: data/bronze/marketplace/
          retention-days: 14

      # Sube el CSV aplanado del día a Cloudflare R2.
      # Solo corre si el scrape salió OK (filas > 0); si scrape.py devuelve
      # exit 1 el job falla aquí y GitHub avisa por email.
      # Requiere estos secrets del repo (Settings > Secrets and variables > Actions):
      #   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET
      # R2_ENDPOINT con la forma https://<account_id>.r2.cloudflarestorage.com
      - name: Subir snapshot a Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # aws-cli v2.23+ exige checksums CRC que R2 no soporta; lo relajamos.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          FECHA=$(date -u -d '-5 hours' +%F)  # fecha en hora Lima (UTC-5), igual que scrape.py
          aws s3 cp "data/bronze/marketplace/${FECHA}.csv" \
            "s3://${R2_BUCKET}/marketplace/${FECHA}.csv" \
            --endpoint-url "$R2_ENDPOINT" --content-type text/csv
          echo "Subido a R2: marketplace/${FECHA}.csv"

      # TODO(S2): cargar el CSV a Supabase Postgres (schema bronze).

      - name: 🚨 Crear issue de alerta por fallo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [Marketplace] Fallo de ingesta $(date -u -d '-5 hours' +%Y-%m-%d)" \
            --body "## Fallo detectado en ingesta Marketplace

          El workflow **${{ github.workflow }}** falló el $(date -u -d '-5 hours' +%F).

          **Detalles:**
          - Runner: \`${{ runner.name }}\`
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Issue auto-creado por GitHub Actions — revisar logs del run para diagnóstico." \
            --label "area:devops"
